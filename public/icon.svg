<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B2130" />
      <stop offset="50%" stop-color="#071822" />
      <stop offset="100%" stop-color="#040D13" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF5" />
      <stop offset="25%" stop-color="#F3C644" />
      <stop offset="75%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#997A1E" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#D4AF37" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background Squircle with Safe Zone Margin -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)" />
  <rect x="20" y="20" width="472" height="472" rx="92" fill="none" stroke="url(#goldGrad)" stroke-width="8" stroke-opacity="0.4" />

  <!-- Inner Geometric Frame -->
  <rect x="48" y="48" width="416" height="416" rx="72" fill="none" stroke="#1E4D6E" stroke-width="3" stroke-dasharray="8 8" />

  <!-- Stylized "A" Monogram for Anke -->
  <g filter="url(#goldGlow)">
    <path d="M256 88 L384 400 L320 400 L292 324 L220 324 L192 400 L128 400 Z M256 188 L234 274 L278 274 Z" fill="url(#goldGrad)" />
  </g>

  <!-- Precision Ledger Bars at the base of A -->
  <rect x="220" y="340" width="72" height="8" rx="4" fill="#38BDF8" opacity="0.8" />

  <!-- Statutory Integrity Indicator Dot (Emerald) -->
  <circle cx="256" cy="438" r="16" fill="#10B981" />
  <circle cx="256" cy="438" r="22" fill="none" stroke="#34D399" stroke-width="3" opacity="0.6" />
</svg>
